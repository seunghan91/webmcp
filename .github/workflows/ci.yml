name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bundle exec rake test
      - run: node --test runtime/test/runtime.test.mjs
      - name: Runtime asset matches the pinned hash
        run: sha256sum -c conformance/RUNTIME.sha256
